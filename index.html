<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>wanyangboop 的星空空间</title>
    <style>
        /* 初始紫色主页样式 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
        #home { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; transition: opacity 1s; }
        .card { background: rgba(255, 255, 255, 0.1); padding: 2.5rem; border-radius: 15px; backdrop-filter: blur(10px); text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3); z-index: 10; }
        button { background: transparent; color: white; border: 2px solid white; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-size: 16px; margin-top: 20px; transition: 0.3s; }
        button:hover { background: white; color: #764ba2; }

        /* 星空背景样式 */
        #starfield { position: fixed; width: 100%; height: 100%; background: black; display: none; opacity: 0; transition: opacity 1s; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle var(--duration) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="home">
        <div class="card">
            <h1>你好，我是 wanyangboop</h1>
            <p>点击下方按钮，带你去看星空</p>
            <button onclick="showStars()">进入星空模式</button>
        </div>
    </div>

    <canvas id="starfield"></canvas>

    <script>
        function showStars() {
            // 隐藏主页，显示星空
            document.getElementById('home').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('home').style.display = 'none';
                const canvas = document.getElementById('starfield');
                canvas.style.display = 'block';
                setTimeout(() => canvas.style.opacity = '1', 50);
                startStarAnimation();
            }, 1000);
        }

        function startStarAnimation() {
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 0.5 });
            }
            function animate() {
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                stars.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                    s.y += s.speed;
                    if (s.y > canvas.height) s.y = 0;
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
