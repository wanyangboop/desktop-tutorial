<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>wanyangboop 的银河流星空间</title>
    <style>
        /* 基础样式：营造深邃宇宙感 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #020205; font-family: 'Microsoft YaHei', sans-serif; }
        
        /* 初始主页：带有银河质感的渐变 */
        #home { display: flex; justify-content: center; align-items: center; height: 100vh; 
                background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%); 
                color: white; transition: opacity 1.5s; z-index: 10; position: relative; }
        
        .card { background: rgba(255, 255, 255, 0.03); padding: 3rem; border-radius: 20px; 
                backdrop-filter: blur(15px); text-align: center; border: 1px solid rgba(255,255,255,0.1); 
                box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #fff, #667eea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; 
                 padding: 15px 40px; border-radius: 50px; cursor: pointer; font-size: 1.1rem; 
                 margin-top: 25px; transition: 0.4s; box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
        button:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(102,126,234,0.5); }

        /* 银河与流星容器 */
        #universe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; opacity: 0; transition: opacity 2s; }
        
        /* 银河系光晕 */
        .galaxy { position: absolute; width: 100%; height: 100%; 
                  background: radial-gradient(ellipse at center, rgba(102,126,234,0.1) 0%, transparent 70%); 
                  filter: blur(50px); transform: rotate(-20deg); }

        /* 流星样式 */
        .meteor { position: absolute; width: 2px; height: 100px; 
                  background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 100%); 
                  opacity: 0; animation: meteor-fall var(--d) linear infinite; }
        
        @keyframes meteor-fall {
            0% { transform: translate(var(--x), -150px) rotate(35deg); opacity: 1; }
            100% { transform: translate(calc(var(--x) + 500px), 110vh) rotate(35deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="home">
        <div class="card">
            <h1>你好，我是 wanyangboop</h1>
            <p>准备好进入银河系看流星雨了吗？</p>
            <button onclick="enterUniverse()">开启星际旅行</button>
        </div>
    </div>

    <div id="universe">
        <div class="galaxy"></div>
        <canvas id="starCanvas"></canvas>
    </div>

    <script>
        function enterUniverse() {
            document.getElementById('home').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('home').style.display = 'none';
                const universe = document.getElementById('universe');
                universe.style.display = 'block';
                setTimeout(() => universe.style.opacity = '1', 50);
                initSky();
            }, 1500);
        }

        function initSky() {
            const container = document.getElementById('universe');
            // 1. 生成海量背景繁星（银河感）
            for (let i = 0; i < 300; i++) {
                const s = document.createElement('div');
                s.style.position = 'absolute';
                s.style.background = 'white';
                s.style.borderRadius = '50%';
                const size = Math.random() * 2;
                s.style.width = s.style.height = size + 'px';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.opacity = Math.random();
                container.appendChild(s);
            }
            // 2. 生成流星雨
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const m = document.createElement('div');
                    m.className = 'meteor';
                    m.style.setProperty('--x', (Math.random() * 120 - 20) + 'vw');
                    m.style.setProperty('--d', (Math.random() * 2 + 1) + 's');
                    container.appendChild(m);
                }, i * 300);
            }
        }
    </script>
</body>
</html>
