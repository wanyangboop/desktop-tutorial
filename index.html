<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>wanyangboop: 星际战机 3.0</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; color: white; }
        #game-container { position: relative; width: 100vw; height: 100vh; cursor: crosshair; background: radial-gradient(circle at center, #1b2735 0%, #050505 100%); }
        
        /* 战机设计 */
        #player { position: absolute; width: 0; height: 0; 
                 border-left: 20px solid transparent; border-right: 20px solid transparent;
                 border-bottom: 40px solid #667eea; 
                 filter: drop-shadow(0 0 15px #667eea); 
                 transform: translate(-50%, -50%); pointer-events: none; z-index: 100; transition: border-bottom-color 0.2s; }
        
        /* 子弹样式 */
        .bullet { position: absolute; width: 4px; height: 20px; background: #00f2ff; border-radius: 2px; box-shadow: 0 0 10px #00f2ff; z-index: 90; }

        /* 护盾与敌人 */
        #shield { position: absolute; width: 80px; height: 80px; border: 3px solid #ffcc00; border-radius: 50%; display: none; transform: translate(-50%, -50%); box-shadow: 0 0 20px #ffcc00; pointer-events: none; z-index: 101; }
        .enemy { position: absolute; width: 30px; height: 30px; background: #ff4b2b; border-radius: 50%; box-shadow: 0 0 15px #ff4b2b; }
        .powerup { position: absolute; width: 20px; height: 20px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 20px #00ffcc; animation: pulse 1s infinite; }

        #ui { position: fixed; top: 20px; left: 20px; z-index: 200; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 300; background: rgba(0,0,0,0.9); padding: 50px; border-radius: 20px; border: 2px solid #667eea; }
        button { background: #667eea; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div id="score">得分: 0</div>
            <div id="difficulty">难度: 1.0</div>
        </div>
        <div id="player"></div>
        <div id="shield"></div>
        <div id="menu">
            <h1>星际战机 3.0</h1>
            <p>鼠标移动躲避，<b>点击左键/空格发射子弹</b>！</p>
            <button onclick="startGame()">开始战斗</button>
        </div>
    </div>

    <script>
        const player = document.getElementById('player');
        const shield = document.getElementById('shield');
        const container = document.getElementById('game-container');
        const scoreElement = document.getElementById('score');
        const diffElement = document.getElementById('difficulty');
        const menu = document.getElementById('menu');
        
        let score = 0, gameActive = false, isInvincible = false;
        let enemies = [], bullets = [], powerups = [], animationId;
        let difficulty = 1.0, spawnRate = 0.05;

        // 鼠标位置同步
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            player.style.left = shield.style.left = mouseX + 'px';
            player.style.top = shield.style.top = mouseY + 'px';
        });

        // 射击监听
        document.addEventListener('mousedown', (e) => { if(gameActive) shoot(); });
        document.addEventListener('keydown', (e) => { if(e.code === 'Space' && gameActive) shoot(); });

        function startGame() {
            score = 0; difficulty = 1.0; gameActive = true;
            menu.style.display = 'none';
            enemies.forEach(e => e.element.remove());
            bullets.forEach(b => b.element.remove());
            powerups.forEach(p => p.element.remove());
            enemies = []; bullets = []; powerups = [];
            if (animationId) cancelAnimationFrame(animationId);
            update();
        }

        function shoot() {
            const b = document.createElement('div');
            b.className = 'bullet';
            b.style.left = mouseX + 'px';
            b.style.top = (mouseY - 20) + 'px';
            container.appendChild(b);
            bullets.push({ element: b, x: mouseX, y: mouseY - 20 });
        }

        function createEnemy() {
            const e = document.createElement('div');
            e.className = 'enemy';
            e.style.left = Math.random() * (window.innerWidth - 30) + 'px';
            e.style.top = '-50px';
            container.appendChild(e);
            enemies.push({ element: e, y: -50, speed: 3 + Math.random() * 4 });
        }

        function update() {
            if (!gameActive) return;

            difficulty += 0.0003;
            spawnRate = 0.04 * difficulty;
            diffElement.innerText = `难度: ${difficulty.toFixed(1)}`;

            if (Math.random() < spawnRate) createEnemy();
            if (Math.random() < 0.005) { /* 能量球逻辑 */
                const p = document.createElement('div'); p.className = 'powerup';
                p.style.left = Math.random() * window.innerWidth + 'px'; p.style.top = '-50px';
                container.appendChild(p); powerups.push({ element: p, y: -50 });
            }

            // 子弹逻辑
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y -= 10;
                b.element.style.top = b.y + 'px';
                if (b.y < -20) { b.element.remove(); bullets.splice(i, 1); }
            }

            // 敌人逻辑 & 碰撞检测
            const pRect = player.getBoundingClientRect();
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;
                e.element.style.top = e.y + 'px';
                const eRect = e.element.getBoundingClientRect();

                // 子弹击中敌人
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    const bRect = b.element.getBoundingClientRect();
                    if (!(bRect.right < eRect.left || bRect.left > eRect.right || bRect.bottom < eRect.top || bRect.top > eRect.bottom)) {
                        e.element.style.background = 'white'; // 闪光效果
                        setTimeout(() => e.element.remove(), 50);
                        enemies.splice(i, 1);
                        b.element.remove();
                        bullets.splice(j, 1);
                        score += 5; scoreElement.innerText = `得分: ${score}`;
                        break;
                    }
                }

                // 战机撞击敌人
                if (gameActive && !isInvincible && !(pRect.right < eRect.left || pRect.left > eRect.right || pRect.bottom < eRect.top || pRect.top > eRect.bottom)) {
                    gameOver(); return;
                }
                if (e.y > window.innerHeight) { e.element.remove(); enemies.splice(i, 1); }
            }

            // 能量球碰撞
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i]; p.y += 3; p.element.style.top = p.y + 'px';
                const pwRect = p.element.getBoundingClientRect();
                if (!(pRect.right < pwRect.left || pRect.left > pwRect.right || pRect.bottom < pwRect.top || pRect.top > pwRect.bottom)) {
                    p.element.remove(); powerups.splice(i, 1); activateShield();
                }
            }

            animationId = requestAnimationFrame(update);
        }

        function activateShield() {
            isInvincible = true; shield.style.display = 'block';
            player.style.borderBottomColor = '#ffcc00';
            setTimeout(() => { isInvincible = false; shield.style.display = 'none'; player.style.borderBottomColor = '#667eea'; }, 3000);
        }

        function gameOver() {
            gameActive = false; cancelAnimationFrame(animationId);
            menu.style.display = 'block';
            menu.innerHTML = `<h1>战机损毁</h1><p>得分: ${score}</p><button onclick="startGame()">修理战机</button>`;
        }
    </script>
</body>
</html>
