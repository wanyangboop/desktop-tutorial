<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>wanyangboop 的星际闪避</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: 'Arial', sans-serif; color: white; }
        #game-container { position: relative; width: 100vw; height: 100vh; cursor: none; }
        #player { position: absolute; width: 40px; height: 40px; background: #667eea; border-radius: 8px; box-shadow: 0 0 20px #667eea; transform: translate(-50%, -50%); pointer-events: none; z-index: 100; }
        .enemy { position: absolute; width: 30px; height: 30px; background: #ff4b2b; border-radius: 50%; box-shadow: 0 0 15px #ff4b2b; }
        #score { position: fixed; top: 20px; left: 20px; font-size: 24px; z-index: 200; }
        #menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 300; background: rgba(0,0,0,0.8); padding: 40px; border-radius: 20px; border: 1px solid #667eea; }
        button { background: #667eea; color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
        button:hover { background: #764ba2; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score">得分: 0</div>
        <div id="player"></div>
        <div id="menu">
            <h1>星际闪避</h1>
            <p>移动鼠标控制蓝色方块，躲避红色陨石！</p>
            <button onclick="startGame()">开始游戏</button>
        </div>
    </div>

    <script>
        const player = document.getElementById('player');
        const container = document.getElementById('game-container');
        const scoreElement = document.getElementById('score');
        const menu = document.getElementById('menu');
        
        let score = 0;
        let gameActive = false;
        let enemies = [];

        // 鼠标跟随
        document.addEventListener('mousemove', (e) => {
            player.style.left = e.clientX + 'px';
            player.style.top = e.clientY + 'px';
        });

        function startGame() {
            score = 0;
            gameActive = true;
            menu.style.display = 'none';
            scoreElement.innerText = `得分: ${score}`;
            enemies.forEach(e => e.remove());
            enemies = [];
            requestAnimationFrame(update);
        }

        function createEnemy() {
            if (!gameActive) return;
            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            enemy.style.left = Math.random() * (window.innerWidth - 30) + 'px';
            enemy.style.top = '-50px';
            container.appendChild(enemy);
            enemies.push({
                element: enemy,
                y: -50,
                speed: 3 + Math.random() * 5
            });
        }

        function update() {
            if (!gameActive) return;

            // 每隔一段时间生成敌人
            if (Math.random() < 0.05) createEnemy();

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;
                e.element.style.top = e.y + 'px';

                // 碰撞检测
                const rect1 = player.getBoundingClientRect();
                const rect2 = e.element.getBoundingClientRect();

                if (!(rect1.right < rect2.left || rect1.left > rect2.right || 
                      rect1.bottom < rect2.top || rect1.top > rect2.bottom)) {
                    gameOver();
                }

                // 移出屏幕后删除
                if (e.y > window.innerHeight) {
                    e.element.remove();
                    enemies.splice(i, 1);
                    score++;
                    scoreElement.innerText = `得分: ${score}`;
                }
            }
            requestAnimationFrame(update);
        }

        function gameOver() {
            gameActive = false;
            menu.style.display = 'block';
            menu.innerHTML = `<h1>游戏结束</h1><p>最终得分: ${score}</p><button onclick="startGame()">再来一局</button>`;
        }
    </script>
</body>
</html>
